name: Build Windows Custom

on:
  workflow_dispatch:
  push:
    branches:
      - trae/agent-c2bwBN

permissions:
  contents: read

env:
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  SCITER_RUST_VERSION: "1.75"
  VCPKG_COMMIT_ID: "177e8175121536d414f405ed8b3099b325a42638"

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply custom server defaults
        shell: pwsh
        run: |
          $p = "libs/hbb_common/src/config.rs"
          $s = Get-Content -Raw -Encoding UTF8 $p
          $s = $s.Replace('pub const RENDEZVOUS_SERVERS: &[&str] = &["rs-ny.rustdesk.com"];', 'pub const RENDEZVOUS_SERVERS: &[&str] = &["xqstudio.x3322.net"];')
          $s = $s.Replace('pub const RS_PUB_KEY: &str = "OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw=";', 'pub const RS_PUB_KEY: &str = "zAIi1xBxIeRzLzBjx3Zw3FMGoURnK83Gq4fgIplImDw=";')
          Set-Content -Path $p -Value $s -Encoding UTF8
          if (-not (Select-String -Path $p -Pattern 'xqstudio.x3322.net' -Quiet)) { throw "ID server patch failed" }
          if (-not (Select-String -Path $p -Pattern 'zAIi1xBxIeRzLzBjx3Zw3FMGoURnK83Gq4fgIplImDw=' -Quiet)) { throw "key patch failed" }

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Replace engine with rustdesk custom flutter engine
        shell: pwsh
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          $binDir = Split-Path (Get-Command flutter).Source -Parent
          $engineDir = Join-Path $binDir "cache\artifacts\engine\windows-x64-release"
          Copy-Item -Force windows-x64-release\* $engineDir

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

      - name: Pin NASM 2.16.03 for legacy ports
        shell: pwsh
        run: |
          $f = "C:\vcpkg\scripts\cmake\vcpkg_find_acquire_program(NASM).cmake"
          $s = Get-Content -Raw -Encoding UTF8 $f
          $s = $s.Replace("set(program_version 3.01)", "set(program_version 2.16.03)")
          $s = $s.Replace("771c238ddb17c98d5736ccaba4ade1d1601d896f09e588489cb43a4f6381bc0ae14d1869f5316fe94f847f54867e65cf12665529b1e7ad88e5e7d3e162719a4f", "22869ceb70ea0e6597fe06abe205b5d5dd66b41fe54dda73d338c488ba6ef13a39158f25b357616bf578752bb112869ef26ad897eb29352e85cf1ecc61a7c07a")
          Set-Content -Path $f -Value $s -Encoding UTF8
          if (-not (Select-String -Path $f -Pattern '2\.16\.03' -Quiet)) { throw "nasm pin failed" }

      - name: Install vcpkg dependencies
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
          VCPKG_BINARY_SOURCES: clear
        run: |
          for attempt in 1 2 3; do
            echo "vcpkg install attempt $attempt"
            if $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
              exit 0
            fi
            sleep 60
          done
          exit 1

      - name: Generate flutter rust bridge
        shell: bash
        run: |
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features "uuid" --locked
          pushd flutter && flutter pub get && popd
          flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h

      - name: Build rustdesk
        run: |
          python3 .\build.py --portable --hwcodec --flutter --vram --skip-portable-pack

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-custom
          path: flutter/build/windows/x64/runner/Release/**
          if-no-files-found: error
